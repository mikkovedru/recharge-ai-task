name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build-linux:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 gir1.2-xapp-1.0 gir1.2-atspi-2.0 gir1.2-ayatanaappindicator3-0.1 appstream desktop-file-utils
          /usr/bin/python3 -m venv --system-site-packages .build-venv
          .build-venv/bin/python -m pip install -e ".[tray,dev]"
      - name: Validate version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            .build-venv/bin/python scripts/check_version.py --tag "$RELEASE_TAG"
          else
            .build-venv/bin/python scripts/check_version.py
          fi
      - name: Build and package
        run: |
          PYTHON=.build-venv/bin/python bash scripts/build_linux.sh
          PYTHON=.build-venv/bin/python bash scripts/package_release.sh
          .build-venv/bin/python scripts/build_appimage.py
      - name: Verify packages
        run: |
          cd dist/release
          sha256sum -c SHA256SUMS-linux.txt
          sha256sum -c SHA256SUMS-appimage.txt
          ./*.AppImage --appimage-extract-and-run --version
          ./*.AppImage --appimage-updateinformation
          dpkg-deb --info *.deb
          mkdir extracted
          unzip -q '*.zip' -d extracted
          chmod +x extracted/recharge-ai-task
          extracted/recharge-ai-task --version
          extracted/recharge-ai-task targets --help
          dpkg-deb --extract ./*.deb deb-root
          deb-root/usr/bin/recharge-ai-task --version
          desktop-file-validate deb-root/usr/share/applications/recharge-ai-task.desktop
          appstreamcli validate --no-net deb-root/usr/share/metainfo/*.xml
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          if-no-files-found: error
          path: |
            dist/release/*.zip
            dist/release/*.deb
            dist/release/*.AppImage
            dist/release/*.AppImage.zsync
            dist/release/SHA256SUMS-appimage.txt
            dist/release/recharge-ai-task
            dist/release/SHA256SUMS-linux.txt

  build-windows:
    needs: checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[windows,tray,dev]"
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if ($env:RELEASE_TAG) {
            python scripts/check_version.py --tag $env:RELEASE_TAG
          } else {
            python scripts/check_version.py
          }
          if ($LASTEXITCODE -ne 0) { throw "Version validation failed" }
      - name: Build and package
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1
          ./scripts/package_release.ps1
          Expand-Archive dist/release/*.zip -DestinationPath dist/extracted
          $Required = @("recharge-ai-task.exe", "recharge-ai-task-cli.exe", "README.md", "RELEASE.md", "LICENSE", "OPEN_SOURCE.md", "CONTRIBUTING.md", "docs/target-selection.md", "docs/2026-11-17_windows-portable.md")
          foreach ($Name in $Required) {
            if (-not (Test-Path "dist/extracted/$Name" -PathType Leaf)) { throw "Missing Windows package file: $Name" }
          }
          & ./dist/extracted/recharge-ai-task-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI version failed" }
          & ./dist/extracted/recharge-ai-task-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI help failed" }
          & ./dist/extracted/recharge-ai-task-cli.exe run --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged terminal wrapper failed" }
          & ./dist/extracted/recharge-ai-task-cli.exe quota --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed" }
          foreach ($Line in Get-Content dist/release/SHA256SUMS-windows.txt) {
            $Hash, $Name = $Line -split '  ', 2
            if ((Get-FileHash "dist/release/$Name" -Algorithm SHA256).Hash.ToLower() -ne $Hash) { throw "Checksum mismatch" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          if-no-files-found: error
          path: |
            dist/release/*.zip
            dist/release/SHA256SUMS-windows.txt

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Render repository links for the release body
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/render_release_notes.py --repository "$RELEASE_REPOSITORY" --ref "$RELEASE_COMMIT" --output build/release-notes.md
      - name: Create draft for review
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Recharge AI-task ${{ github.ref_name }}
          body_path: build/release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/linux-x86_64/*.zip
            artifacts/linux-x86_64/*.deb
            artifacts/linux-x86_64/*.AppImage
            artifacts/linux-x86_64/*.AppImage.zsync
            artifacts/linux-x86_64/SHA256SUMS-appimage.txt
            artifacts/linux-x86_64/recharge-ai-task
            artifacts/linux-x86_64/SHA256SUMS-linux.txt
            artifacts/windows-x86_64/*.zip
            artifacts/windows-x86_64/SHA256SUMS-windows.txt
