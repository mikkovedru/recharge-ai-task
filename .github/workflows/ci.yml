name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "Windows" ]; then
            pip install -e ".[windows,tray,dev]"
          else
            pip install -e ".[tray,dev]"
          fi

      - name: Run tests
        run: pytest tests/ -v

  wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 gir1.2-atspi-2.0 gir1.2-ayatanaappindicator3-0.1 weston xvfb dbus-x11
          /usr/bin/python3 -m venv --system-site-packages .desktop-venv
          .desktop-venv/bin/python -m pip install -e ".[tray,dev]"
      - name: Test a native Wayland session without X11
        env:
          RECHARGE_AI_TASK_WAYLAND_TESTS: "1"
        run: .desktop-venv/bin/python -m pytest -v tests/test_wayland.py
