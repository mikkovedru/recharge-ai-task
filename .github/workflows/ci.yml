name: CI

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "Windows" ]; then
            pip install -e ".[windows,tray,dev]"
          else
            pip install -e ".[tray,dev]"
          fi

      - name: Run tests
        env:
          PYSTRAY_BACKEND: dummy
        run: python -m pytest tests/ -q

  wayland:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 gir1.2-xapp-1.0 gir1.2-atspi-2.0 gir1.2-ayatanaappindicator3-0.1 weston xvfb dbus-x11 xdotool desktop-file-utils openbox xclip
          /usr/bin/python3 -m venv --system-site-packages .desktop-venv
          .desktop-venv/bin/python -m pip install -e ".[tray,dev]"
      - name: Test Linux GTK interface under X11
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1200x24" bash -c '
            openbox >/tmp/openbox.log 2>&1 &
            trap "kill $!" EXIT
            sleep 1
            RECHARGE_AI_TASK_GUI_TESTS=1 .desktop-venv/bin/python -m pytest -q
          '

      - name: Test a native Wayland session without X11
        env:
          RECHARGE_AI_TASK_WAYLAND_TESTS: "1"
        run: .desktop-venv/bin/python -m pytest -v tests/test_wayland.py
