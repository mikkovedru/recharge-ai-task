[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recharge-ai-task"
version = "1.0"
description = "Auto-continue Codex, Claude, Meta Muse Code, Google Gemini/Antigravity and OpenCode terminals after usage limits — Linux dashboard, Windows tray and terminal commands"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Recharge AI-task contributors" }]
keywords = ["codex", "openai", "claude", "anthropic", "muse", "meta", "gemini", "google", "antigravity", "opencode", "quota", "rate-limit", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = ["websocket-client>=1.8", "psutil>=6.0", "python-xlib>=0.33; sys_platform == 'linux'", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
windows = ["pywinpty>=2.0.15; sys_platform == 'win32'"]
tray = ["pystray>=0.19.5", "Pillow>=10.0.0"]
dev = ["pytest>=8.0", "pyinstaller>=6.0", "markdown-it-py>=3.0"]
all = ["recharge-ai-task[windows,tray]"]

[project.urls]
Homepage = "https://github.com/mikkovedru/recharge-ai-task"
Repository = "https://github.com/mikkovedru/recharge-ai-task"
Issues = "https://github.com/mikkovedru/recharge-ai-task/issues"

[project.scripts]
recharge-ai-task = "recharge_ai_task.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["recharge_ai_task*"]

[tool.setuptools.package-data]
recharge_ai_task = ["locales/*.json", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
